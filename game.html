<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="학생이나 직장인이 되어 일주일 동안 화를 참을지, 터뜨릴지, 건강하게 풀지 고르는 벌꿀오소리 웹게임.">
<meta property="og:title" content="벌꿀오소리 · 화가 나는 건 당연해. 잘 풀면 돼.">
<meta property="og:description" content="학생이나 직장인이 되어 일주일 동안 화를 참을지, 터뜨릴지, 건강하게 풀지 고르는 벌꿀오소리 웹게임.">
<meta property="og:image" content="https://wnsgjs066-bit.github.io/honey-badger/img/sticker-surprise.webp">
<meta name="theme-color" content="#FBF3E1">
<link rel="icon" href="img/sticker-surprise.webp" type="image/webp">
<title>벌꿀오소리의 화 처리법</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* One committed look: the homepage's grid-paper world. Single theme by choice, every colour set explicitly. */
:root{
  --ink:#23221E; --ink-2:#4A4740; --ink-3:#6B665B;
  --paper:#FBF3E1; --grid:#EFE3C6; --card:#FFFDF7; --mane:#ECEBE7;
  --honey:#F2B33D; --honey-2:#FBE3A6; --sky:#BFE0F3; --sky-2:#8CBEDA;
  --grass:#619D50; --pink:#F2D4DC; --coral:#EE8470; --red:#D9572E; --brown:#6A3F24;
  --display:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --hand:'Gaegu','Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{
  margin:0; color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);
  background-size:32px 32px;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  word-break:keep-all; overflow-wrap:anywhere;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;touch-action:manipulation}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--honey);outline-offset:3px}

.app{max-width:480px;margin:0 auto;min-height:100%;padding:16px 16px 28px;display:flex;flex-direction:column;gap:16px;position:relative}
.screen{display:flex;flex-direction:column;gap:16px;flex:1}

/* ---------- shared bits ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 22px;
  font-family:var(--display);font-size:19px;line-height:1.2;border:3px solid var(--ink);border-radius:999px;background:var(--card);
  box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s;text-align:center}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--ink)}
.btn-dark{background:var(--ink);color:var(--card);box-shadow:4px 4px 0 var(--honey)}
.btn-dark:hover{box-shadow:5px 5px 0 var(--honey)}
.btn-dark:active{box-shadow:1px 1px 0 var(--honey)}
.btn-honey{background:var(--honey)}
.btn-block{width:100%}
.btn-big{min-height:76px;font-size:26px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:13px;line-height:1;padding:6px 11px;border:2px solid var(--ink);border-radius:999px;background:var(--card);white-space:nowrap}
.chip.honey{background:var(--honey)}
.chip.dark{background:var(--ink);color:var(--card)}
.chip.pink{background:var(--pink)}
.chip.sky{background:var(--sky)}
.chip.good{background:#CDE3B8}
.chip.bad{background:#F7C9BC}
.hand{font-family:var(--hand);font-weight:700}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink)}
.eyebrow{font-family:var(--display);font-size:13px;letter-spacing:.14em;color:var(--ink-3)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.muted{color:var(--ink-3)}

/* ---------- title ---------- */
.title-hero{position:relative;padding:22px 20px 20px;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.title-hero h1{font-size:clamp(38px,11vw,56px);letter-spacing:-.02em}
.title-hero h1 .mk{background:linear-gradient(transparent 58%,var(--honey) 58%,var(--honey) 92%,transparent 92%)}
.title-scene{position:relative;height:210px;border:3px solid var(--ink);border-radius:18px;background:var(--sky-2);overflow:hidden}
.title-scene .ground{position:absolute;left:0;right:0;bottom:0;height:52px;background:var(--grass);border-top:3px solid var(--ink)}
.title-scene .cloud{position:absolute;height:30px;background:var(--card);border:3px solid var(--ink);border-radius:999px}
.title-scene img.sprite{position:absolute;left:50%;bottom:36px;height:150px;transform:translateX(-50%);transform-origin:50% 100%;animation:waddle 1s ease-in-out infinite}
.title-scene .bubble{position:absolute;right:14px;top:18px}
@keyframes waddle{0%,100%{transform:translateX(-50%) rotate(-2deg)}50%{transform:translateX(-50%) rotate(2deg) translateY(-4px)}}
.bubble{position:relative;display:inline-block;background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:8px 14px;font-family:var(--hand);font-weight:700;font-size:19px;line-height:1.2}
.bubble::after{content:'';position:absolute;left:22px;bottom:-10px;width:14px;height:14px;background:var(--card);border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.bubble.r::after{left:auto;right:22px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;background:var(--paper);text-align:center}
.fact b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(16px,4.6vw,20px);line-height:1.1}
.fact span{font-size:12px;color:var(--ink-3)}

/* ---------- opening ---------- */
.film{position:relative;flex:1;min-height:420px;border:3px solid var(--ink);border-radius:22px;background:var(--ink);color:var(--card);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
.film img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.film .caption{position:relative;margin:16px;padding:16px 18px;background:rgba(35,34,30,.86);border-radius:14px;font-family:var(--hand);font-weight:700;font-size:23px;line-height:1.35;animation:rise .45s ease both}
.film .rec{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:13px;letter-spacing:.12em;background:rgba(35,34,30,.7);padding:6px 10px;border-radius:999px}
.film .rec i{width:9px;height:9px;border-radius:50%;background:var(--coral);animation:blink 1.1s steps(2,start) infinite}
.film .count{position:absolute;top:14px;right:14px;font-family:var(--display);font-size:13px;background:rgba(35,34,30,.7);padding:6px 10px;border-radius:999px}
@keyframes blink{to{visibility:hidden}}
@keyframes rise{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- role ---------- */
.roles{display:grid;gap:14px}
.role{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center;text-align:left;padding:12px;background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);cursor:pointer;transition:transform .12s}
.role:hover{transform:translate(-2px,-2px)}
.role:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.role img{width:112px;height:130px;object-fit:cover;object-position:50% 25%;border:2.5px solid var(--ink);border-radius:14px}
.role h3{font-size:28px}
.role p{font-size:15px;color:var(--ink-2);margin-top:4px}

/* ---------- day intro ---------- */
.week-dots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week-dots span{display:flex;align-items:center;justify-content:center;height:38px;border:2.5px solid var(--ink);border-radius:12px;font-family:var(--display);font-size:16px;background:var(--card)}
.week-dots span.done{background:var(--ink);color:var(--card)}
.week-dots span.now{background:var(--honey);transform:translateY(-3px);box-shadow:0 3px 0 var(--ink)}
.dayhead{padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.dayhead .big{font-size:clamp(56px,17vw,76px);line-height:1}
.status{display:grid;gap:10px;padding:16px 18px}

/* ---------- gauges ---------- */
.gauge{display:grid;grid-template-columns:44px 1fr 34px;align-items:center;gap:8px}
.gauge label{font-family:var(--display);font-size:15px}
.gauge .bar{height:14px;border:2.5px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.gauge .fill{height:100%;border-radius:999px;transition:width .5s cubic-bezier(.3,1.3,.5,1),background .3s}
.gauge output{font-family:var(--display);font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.gauge.anger .bar{height:18px}
.gauge.anger label,.gauge.anger output{font-size:18px}

/* ---------- play ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:10px 14px 12px;display:grid;gap:8px;background:var(--card)}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hud-top .when{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.hud-mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hud-mini .gauge{grid-template-columns:34px 1fr 28px;gap:6px}
.hud-mini .gauge label,.hud-mini .gauge output{font-size:13px}
.hud-mini .gauge .bar{height:11px}

.evcard{overflow:hidden;animation:dealt .35s cubic-bezier(.3,1.3,.5,1) both}
@keyframes dealt{from{transform:translateY(14px) rotate(-1.5deg);opacity:.3}to{transform:none;opacity:1}}
.evcard .pic{position:relative;height:clamp(150px,28vh,220px);border-bottom:3px solid var(--ink);background:var(--mane)}
.evcard .pic img{width:100%;height:100%;object-fit:cover;object-position:50% 28%}
.evcard .pic .chip{position:absolute;top:12px;left:12px}
.evcard .pic .add{position:absolute;top:auto;left:auto;right:12px;bottom:12px;font-size:16px;padding:7px 12px}
.evcard .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.evcard h2{font-size:24px}
.note{font-size:14px;color:var(--ink-2)}
.opts{display:grid;gap:10px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;min-height:64px;padding:11px 14px 12px;text-align:left;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .15s}
.opt:hover{background:#FFF7E4}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt:disabled{opacity:.5;cursor:not-allowed}
.opt .lbl{font-size:17px;line-height:1.35}
.opt .tags{display:flex;gap:6px;flex-wrap:wrap}
.opt[data-type="heal"]{background:#EAF4DF}
.opt[data-type="heal"]:hover{background:#E0EED1}
.result{display:flex;flex-direction:column;gap:12px;animation:rise .3s ease both}
.result .line{font-family:var(--hand);font-weight:700;font-size:21px;line-height:1.35}
.result .memo{font-size:14px;color:var(--ink-2);border-left:0;background:var(--honey-2);border-radius:10px;padding:8px 12px}
.deltas{display:flex;gap:6px;flex-wrap:wrap}

/* high anger: comic focus lines round the screen */
.focus{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .4s;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(35,34,30,.13) 0deg 1.4deg,transparent 1.4deg 7deg);
  -webkit-mask:radial-gradient(ellipse at center,transparent 52%,#000 78%);mask:radial-gradient(ellipse at center,transparent 52%,#000 78%)}
.hot .focus{opacity:.8}
.hotter .focus{opacity:1;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(217,87,46,.22) 0deg 1.4deg,transparent 1.4deg 6deg)}

/* ---------- minigames ---------- */
.mini{padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px;animation:rise .3s ease both}
.mini-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mini-head h2{font-size:26px}
.mini-how{font-size:15px;color:var(--ink-2)}
.mini-stat{font-family:var(--display);font-size:20px;text-align:center;font-variant-numeric:tabular-nums}
.dig-scene{position:relative;height:200px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--sky-2)}
.dig-scene .earth{position:absolute;left:0;right:0;bottom:0;height:120px;background:#8A5A3B;border-top:3px solid var(--ink)}
.dig-scene .hole{position:absolute;left:50%;top:80px;width:110px;transform:translateX(-50%);background:#3B2618;border:3px solid var(--ink);border-top:0;border-radius:0 0 50px 50px;height:0;transition:height .12s}
.dig-scene img{position:absolute;left:50%;bottom:112px;height:110px;transform:translateX(-50%);transition:bottom .12s}
.dig-scene .dirt{position:absolute;font-family:var(--display);font-size:22px;color:#8A5A3B;pointer-events:none;animation:fly .6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),-70px);opacity:0}}
.breath-wrap{display:flex;align-items:center;justify-content:center;height:220px;border:3px solid var(--ink);border-radius:16px;background:linear-gradient(#5E9CC8,#2F6E9C);overflow:hidden;position:relative}
.breath-ring{width:180px;height:180px;border-radius:50%;border:3px solid var(--card);display:flex;align-items:center;justify-content:center;background:rgba(255,253,247,.18);transform:scale(.55);will-change:transform}
.breath-ring span{font-family:var(--display);font-size:20px;color:var(--card);text-align:center;line-height:1.2}
.breath-wrap .bub{position:absolute;bottom:-10px;width:12px;height:12px;border-radius:50%;border:2px solid var(--card);animation:up 3s linear infinite}
@keyframes up{to{transform:translateY(-240px)}}
.pad{min-height:84px;font-size:22px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pad.on{background:var(--honey);transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.blob{position:relative;margin:4px auto 0;width:220px;height:170px;display:flex;align-items:center;justify-content:center;text-align:center;padding:26px;background:#E7B7C4;border:3px solid var(--ink);border-radius:58% 42% 55% 45%/48% 60% 40% 52%;font-family:var(--hand);font-weight:700;font-size:18px;line-height:1.25;animation:wobble 3s ease-in-out infinite;transition:transform .5s,width .5s,height .5s}
.blob.small{transform:scale(.55)}
@keyframes wobble{50%{border-radius:45% 55% 42% 58%/58% 44% 56% 42%}}
.words{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.words .btn{font-size:17px;min-height:54px;padding:10px 12px}
.words .btn.right{background:#CDE3B8}
.words .btn.wrong{background:#F7C9BC}
.paper{position:relative;background:#FFFDF7;border:2.5px solid var(--ink);border-radius:6px;padding:12px;background-image:repeating-linear-gradient(transparent 0 27px,#E6DCC4 27px 28px);transition:transform .9s cubic-bezier(.5,-0.3,.6,1),opacity .9s,border-radius .9s}
.paper textarea{width:100%;min-height:120px;border:0;background:transparent;resize:none;font-family:var(--hand);font-weight:700;font-size:21px;line-height:28px;color:var(--ink);outline:none}
.paper.crumple{transform:translateY(160px) scale(.12) rotate(540deg);border-radius:50%;opacity:0}
.burial{position:relative;height:56px;border-top:3px solid var(--ink);background:#8A5A3B;border-radius:0 0 16px 16px;overflow:hidden}
.burial::after{content:'';position:absolute;left:50%;top:-3px;width:90px;height:34px;transform:translateX(-50%);background:#3B2618;border:3px solid var(--ink);border-top:0;border-radius:0 0 45px 45px}
.talk-log{display:flex;flex-direction:column;gap:10px;min-height:150px;padding:12px;border:3px solid var(--ink);border-radius:16px;background:var(--sky)}
.talk-log .me{align-self:flex-end;max-width:80%;background:var(--card);border:2.5px solid var(--ink);border-radius:16px 16px 4px 16px;padding:8px 12px;font-family:var(--hand);font-weight:700;font-size:19px;animation:rise .25s both}
.talk-log .ham{display:flex;align-items:flex-end;gap:8px;animation:rise .25s both}
.talk-log .ham img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:18% 42%;border:2.5px solid var(--ink)}
.talk-log .ham span{background:#F6E6C8;border:2.5px solid var(--ink);border-radius:16px 16px 16px 4px;padding:6px 12px;font-family:var(--hand);font-weight:700;font-size:18px}
.nap-scene{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0}
.nap-ring{width:190px;height:190px;border-radius:50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--honey) 0turn,var(--card) 0turn)}
.nap-ring .inner{width:146px;height:146px;border-radius:50%;border:3px solid var(--ink);overflow:hidden;background:var(--mane)}
.nap-ring img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.zzz{font-family:var(--display);font-size:22px;color:var(--ink-3);min-height:30px}
.trap-scene{position:relative;height:200px;border:3px solid var(--ink);border-radius:16px;background:#F7C9BC;overflow:hidden;display:flex;align-items:flex-end;justify-content:space-around;padding:0 10px}
.trap-scene img{height:170px}
.sandbag{width:70px;height:130px;margin-bottom:30px;background:#B98A5E;border:3px solid var(--ink);border-radius:26px;transform-origin:50% -30px;transition:transform .1s}
.sandbag.hit{transform:rotate(14deg)}

/* ---------- boom ---------- */
.boom{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:rgba(217,87,46,.88);animation:shake .5s}
.boom .panel{max-width:420px;width:100%;overflow:hidden;text-align:center}
.boom .panel img{width:100%;height:190px;object-fit:cover;object-position:50% 30%;border-bottom:3px solid var(--ink)}
.boom .in{padding:16px 18px 20px;display:flex;flex-direction:column;gap:10px;align-items:center}
.boom h2{font-size:64px;line-height:1;color:var(--red)}
@keyframes shake{10%,50%,90%{transform:translateX(-8px)}30%,70%{transform:translateX(8px)}100%{transform:none}}

/* ---------- report / ending ---------- */
.report{padding:18px;display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border:2.5px solid var(--ink);border-radius:14px;padding:10px 8px;text-align:center;background:var(--paper)}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{font-family:var(--display);color:var(--ink-3)}
.kv dd{margin:0}
.comfort{position:relative;overflow:hidden;animation:flipin .7s cubic-bezier(.3,1.3,.5,1) both;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);background-size:28px 28px}
@keyframes flipin{from{transform:perspective(900px) rotateY(80deg);opacity:.4}to{transform:none;opacity:1}}
.comfort img{width:100%;height:170px;object-fit:cover;object-position:50% 28%;border-bottom:3px solid var(--ink)}
.comfort .in{padding:14px 18px 18px;display:flex;flex-direction:column;gap:8px}
.comfort h3{font-size:22px}
.comfort p{font-family:var(--hand);font-weight:700;font-size:21px;line-height:1.35}
.ending-hero{overflow:hidden}
.ending-hero img{width:100%;height:220px;object-fit:cover;object-position:50% 28%;border-bottom:3px solid var(--ink)}
.ending-hero .in{padding:18px;display:flex;flex-direction:column;gap:10px}
.ending-hero h1{font-size:40px}
.ending-hero .lines p{font-family:var(--hand);font-weight:700;font-size:21px;line-height:1.4;animation:rise .5s both}
.ending-hero .lines p:nth-child(2){animation-delay:.25s}
.ending-hero .lines p:nth-child(3){animation-delay:.5s}
.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:150px;padding:0 2px;border-bottom:2.5px solid var(--ink);position:relative}
.chart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart .v{font-family:var(--display);font-size:13px;font-variant-numeric:tabular-nums}
.chart .b{width:100%;border:2.5px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0}
.chart .line100{position:absolute;left:0;right:0;border-top:2px dashed var(--red)}
.chart-x{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;text-align:center;font-family:var(--display);font-size:14px;margin-top:6px}
.dex{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dex span{display:flex;align-items:center;justify-content:center;min-height:40px;padding:6px;text-align:center;font-family:var(--display);font-size:14px;border:2.5px dashed var(--ink-3);border-radius:12px;color:var(--ink-3)}
.dex span.on{border-style:solid;border-color:var(--ink);background:#CDE3B8;color:var(--ink)}
.copybox{width:100%;min-height:110px;font:inherit;font-size:14px;border:2.5px solid var(--ink);border-radius:12px;padding:10px;background:var(--card);color:var(--ink)}
.foot{font-size:12px;color:var(--ink-3);text-align:center}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>


<div class="focus" aria-hidden="true"></div>
<main class="app" id="app">

  <!-- TITLE -->
  <section class="screen" id="scr-title">
    <div class="panel title-hero">
      <span class="eyebrow">벌꿀오소리의 화 처리법</span>
      <h1>화가 나는 건<br><span class="mk">당연해.</span></h1>
      <p class="muted">학생이나 직장인이 되어 일주일을 버텨 보세요. 화가 날 때마다 참을지, 터뜨릴지, 건강하게 풀지 고르는 게임이에요.</p>
      <div class="title-scene" aria-hidden="true">
        <div class="cloud" style="left:18px;top:26px;width:92px"></div>
        <div class="cloud" style="left:120px;top:70px;width:64px"></div>
        <div class="bubble r">잘 풀면 돼.</div>
        <div class="ground"></div>
        <img class="sprite" src="img/sticker-walk.webp" alt="">
      </div>
      <div class="facts">
        <div class="fact"><b>7일</b><span>월요일부터 일요일</span></div>
        <div class="fact"><b>약 3분</b><span>하루 한 판</span></div>
        <div class="fact"><b>6가지</b><span>화 푸는 방법</span></div>
      </div>
    </div>
    <div class="row">
      <button class="btn btn-dark btn-block" id="btn-start" type="button">관찰 시작하기</button>
    </div>
    <button class="btn btn-block" id="btn-continue" type="button" hidden></button>
    <p class="foot">화 푸는 방법들은 실제로 도움이 된다고 알려진 방법을 게임으로 옮겼어요.</p>
  </section>

  <!-- OPENING -->
  <section class="screen" id="scr-open" hidden>
    <div class="film" id="film" role="button" tabindex="0" aria-label="다음 장면">
      <img id="film-img" alt="" hidden>
      <div class="rec"><i></i>관찰 기록</div>
      <div class="count" id="film-count">1 / 5</div>
      <p class="caption" id="film-text"></p>
    </div>
    <div class="row">
      <button class="btn" id="btn-skip" type="button">건너뛰기</button>
      <button class="btn btn-dark" id="btn-next-cut" type="button">다음</button>
    </div>
  </section>

  <!-- ROLE -->
  <section class="screen" id="scr-role" hidden>
    <div>
      <span class="eyebrow">관찰 대상 고르기</span>
      <h2 style="font-size:34px;margin-top:6px">누구의 일주일을 볼까요?</h2>
    </div>
    <div class="roles">
      <button class="role" type="button" data-role="student">
        <img src="img/desk.webp" alt="책상 앞에서 웃는 벌꿀오소리">
        <span><h3>학생</h3><p>과제, 팀플, 시험. 화낼 일이 끊이지 않는 캠퍼스의 일주일.</p></span>
      </button>
      <button class="role" type="button" data-role="worker">
        <img src="img/walk.webp" alt="서류가방을 들고 걷는 벌꿀오소리">
        <span><h3>직장인</h3><p>지하철, 회의, 잔소리. 서류가방 하나 들고 버티는 회사의 일주일.</p></span>
      </button>
    </div>
    <p class="note">화는 매일 밤 조금씩 가라앉지만, 참아서 쌓인 압력과 관계는 다음 날로 이어져요.</p>
  </section>

  <!-- DAY INTRO -->
  <section class="screen" id="scr-intro" hidden></section>

  <!-- PLAY -->
  <section class="screen" id="scr-play" hidden>
    <header class="panel hud" id="hud"></header>
    <div id="stage"></div>
  </section>

  <!-- REPORT -->
  <section class="screen" id="scr-report" hidden></section>

  <!-- ENDING -->
  <section class="screen" id="scr-end" hidden></section>
</main>
<div class="boom" id="boom" hidden role="dialog" aria-modal="true" aria-labelledby="boom-title"></div>

<script src="data.js"></script>
<script>
(function () {
  'use strict';
  var D = window.GAME_DATA;
  var SAVE_KEY = 'hb-anger-week-v1';
  var GNAMES = { dig: '굴 파기', breath: '수영 호흡', name: '이름 붙이기', write: '끄적이고 묻기', talk: '털어놓기', nap: '한숨 자기' };
  var S = null;           // game state
  var cleanups = [];      // listeners/timers of the running minigame
  var filmIdx = 0;
  // When embedded in the homepage the game lives in #hb-game; standalone it owns the page.
  var GROOT = document.getElementById('hb-game') || document.body;
  var booted = false;
  function scrollGameTop() {
    if (GROOT === document.body) { window.scrollTo(0, 0); return; }
    if (!booted) return;
    var cs = getComputedStyle(GROOT);
    if (cs.overflowY === 'auto' || cs.overflowY === 'scroll') {
      GROOT.scrollTop = 0;
      var r = GROOT.getBoundingClientRect();
      if (r.top < 0 || r.top > window.innerHeight * 0.6) GROOT.scrollIntoView({ block: 'start' });
    } else {
      var t = GROOT.getBoundingClientRect().top;
      if (t < 0 || t > window.innerHeight * 0.4) GROOT.scrollIntoView({ block: 'start' });
    }
  }

  /* ---------- helpers ---------- */
  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function img(k) { return 'img/' + k + '.webp'; }
  function clamp(v) { return Math.max(0, Math.min(100, Math.round(v))); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function role() { return D.roles[S.role]; }
  function fill(str) { return String(str).replace('{friend}', role().friend).replace('{pig}', role().pig).replace('{tomorrow}', D.tomorrow[S.role]); }
  function angerColor(v) { return v >= 70 ? 'var(--red)' : v >= 40 ? 'var(--coral)' : 'var(--honey)'; }
  function cleanup() { cleanups.forEach(function (f) { try { f(); } catch (e) {} }); cleanups = []; }
  function onKey(type, fn) { document.addEventListener(type, fn); cleanups.push(function () { document.removeEventListener(type, fn); }); }
  function isTyping(e) { var t = e.target; return t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT'); }

  function show(id) {
    ['title', 'open', 'role', 'intro', 'play', 'report', 'end'].forEach(function (k) { $('#scr-' + k).hidden = (k !== id); });
    GROOT.classList.remove('hot', 'hotter');
    scrollGameTop();
  }

  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
  function load() { try { var s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

  function gauge(cls, label, v, color) {
    return '<div class="gauge ' + cls + '"><label>' + label + '</label><div class="bar" role="meter" aria-label="' + label + '" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + v + '"><div class="fill" style="width:' + v + '%;background:' + color + '"></div></div><output>' + v + '</output></div>';
  }

  /* ---------- title ---------- */
  function showTitle() {
    var sv = load();
    var c = $('#btn-continue');
    if (sv && sv.role && typeof sv.day === 'number') {
      c.hidden = false;
      c.textContent = '이어하기 · ' + D.roles[sv.role].name + ' ' + D.days[sv.day].label;
    } else c.hidden = true;
    show('title');
  }

  /* ---------- opening ---------- */
  function renderCut() {
    var cut = D.opening[filmIdx];
    var im = $('#film-img');
    if (cut.img) { im.src = img(cut.img); im.hidden = false; } else im.hidden = true;
    var t = $('#film-text');
    t.textContent = cut.text;
    t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
    $('#film-count').textContent = (filmIdx + 1) + ' / ' + D.opening.length;
    $('#btn-next-cut').textContent = filmIdx === D.opening.length - 1 ? '관찰 대상 고르기' : '다음';
  }
  function nextCut() { if (filmIdx < D.opening.length - 1) { filmIdx++; renderCut(); } else show('role'); }

  /* ---------- state ---------- */
  function newState(r) {
    return { role: r, day: 0, ev: 0, anger: 10, pressure: 0, rel: 70, energy: 100, lastHeal: null, nextBonus: 0,
      today: null,
      week: { hold: 0, burst: 0, heal: 0, trap: 0, expl: 0, pexpl: 0, early: 0, games: {}, peaks: [], cards: [] } };
  }
  function newToday() { return { hold: 0, burst: 0, heal: 0, expl: 0, top: null, topAdd: 0, peak: S.anger, early: false, start: null, last: null, hinted: false }; }
  function events() {
    var list = S.day < 5 ? D.events[S.role][S.day] : D.events.weekend[S.day - 5];
    return list;
  }

  /* ---------- day intro ---------- */
  function dayIntro() {
    save();
    var d = D.days[S.day];
    var dots = D.days.map(function (x, i) { return '<span class="' + (i < S.day ? 'done' : i === S.day ? 'now' : '') + '">' + x.short + '</span>'; }).join('');
    $('#scr-intro').innerHTML =
      '<div class="week-dots" aria-label="일주일 진행">' + dots + '</div>' +
      '<div class="panel dayhead"><span class="eyebrow">' + esc(role().name) + ' · DAY ' + (S.day + 1) + ' / 7</span>' +
      '<h1 class="big">' + d.label + '</h1><span class="chip honey" style="align-self:flex-start">' + esc(d.theme) + '</span>' +
      '<p class="hand" style="font-size:21px;line-height:1.4">' + esc(d.intro) + '</p></div>' +
      '<div class="panel status"><span class="eyebrow">지금 상태</span>' +
      gauge('anger', '화', S.anger, angerColor(S.anger)) + gauge('', '기운', S.energy, 'var(--grass)') + gauge('', '관계', S.rel, 'var(--pink)') +
      (S.day > 0 && S.pressure >= 40 ? '<p class="note">관찰자 메모: 지난날 참은 화가 아직 속에 남아 있다.</p>' : '') + '</div>' +
      '<button class="btn btn-dark btn-block" id="btn-day" type="button">' + d.label + ' 시작</button>' +
      '<button class="btn btn-block" id="btn-home" type="button">처음 화면으로</button>';
    $('#btn-day').onclick = startDay;
    $('#btn-home').onclick = showTitle;
    show('intro');
  }

  function startDay() {
    S.ev = 0; S.today = newToday(); S.lastHeal = null;
    show('play');
    showEvent();
  }

  /* ---------- HUD ---------- */
  function hud() {
    var ev = events()[Math.min(S.ev, events().length - 1)];
    $('#hud').innerHTML =
      '<div class="hud-top"><span class="chip dark">' + D.days[S.day].short + ' · ' + (S.day + 1) + '/7 · ' + esc(role().name) + '</span><span class="when">' + esc(ev.t) + '</span></div>' +
      gauge('anger', '화', S.anger, angerColor(S.anger)) +
      '<div class="hud-mini">' + gauge('', '기운', S.energy, 'var(--grass)') + gauge('', '관계', S.rel, 'var(--pink)') + '</div>';
    GROOT.classList.toggle('hot', S.anger >= 60 && S.anger < 85);
    GROOT.classList.toggle('hotter', S.anger >= 85);
  }

  /* ---------- events ---------- */
  function showEvent() {
    var ev = events()[S.ev];
    if (!S.today.start) S.today.start = ev.t;
    S.today.last = ev.t;
    var add = 0, boosted = false;
    if (!ev.good) {
      boosted = S.pressure >= 50;
      add = Math.round(ev.anger * (boosted ? 1.5 : 1)) + S.nextBonus;
      S.nextBonus = 0;
      S.anger = clamp(S.anger + add);
      if (add > S.today.topAdd) { S.today.topAdd = add; S.today.top = fill(ev.title); }
      S.today.peak = Math.max(S.today.peak, S.anger);
    }
    hud();
    var addChip = ev.good ? '<span class="chip good add">좋은 일</span>' : '<span class="chip bad add">화 +' + add + '</span>';
    var opts = ev.opts.map(function (o, i) {
      var tags = '', dis = '';
      if (o.type === 'hold') tags = '<span class="chip">참기</span>';
      else if (o.type === 'burst') tags = '<span class="chip pink">터뜨리기</span>';
      else if (o.type === 'trap') tags = '<span class="chip pink">' + esc(role().pig) + ' 추천</span>';
      else if (o.type === 'plain') tags = '<span class="chip good">좋은 선택</span>';
      else if (o.type === 'heal') {
        var g = D.games[o.game];
        tags = '<span class="chip good">풀기 · ' + GNAMES[o.game] + '</span>' + (g.energy > 0 ? '<span class="chip">기운 -' + g.energy + '</span>' : '<span class="chip sky">기운 +' + (-g.energy) + '</span>');
        if (g.energy > 0 && S.energy < g.energy) { dis = ' disabled'; tags += '<span class="chip bad">기운 부족</span>'; }
      }
      return '<button class="opt" type="button" data-i="' + i + '" data-type="' + o.type + '"' + dis + '><span class="tags">' + tags + '</span><span class="lbl">' + esc(fill(o.label)) + '</span></button>';
    }).join('');
    $('#stage').innerHTML =
      '<article class="panel evcard"><div class="pic"><img src="' + img(ev.img) + '" alt=""><span class="chip dark">' + esc(ev.t) + ' · ' + (S.ev + 1) + '/' + events().length + '</span>' + addChip + '</div>' +
      '<div class="body"><h2>' + esc(fill(ev.title)) + '</h2>' +
      (boosted ? '<p class="note">쌓인 압력 때문에 평소보다 화가 1.5배로 올랐다.</p>' : '') +
      '<div class="opts" id="opts">' + opts + '</div></div></article>';
    Array.prototype.forEach.call(document.querySelectorAll('#opts .opt'), function (b) {
      b.onclick = function () { choose(ev, ev.opts[+b.dataset.i]); };
    });
    if (S.anger >= 100) boom('anger', function () {});
  }

  function snapshot() { return { anger: S.anger, energy: S.energy, rel: S.rel }; }

  function choose(ev, o) {
    Array.prototype.forEach.call(document.querySelectorAll('#opts .opt'), function (b) { b.disabled = true; });
    var before = snapshot();
    var W = S.week, T = S.today;
    if (o.type === 'hold') {
      S.anger -= 8; S.pressure += Math.round((ev.anger || 5) * 0.8);
      W.hold++; T.hold++;
      var lines = [pick(D.results.hold)];
      var P = clamp(S.pressure);
      if (P >= 80) lines.push({ memo: '관찰자 메모: 개체가 곧 터질 것 같다.' });
      else if (P >= 50 && !T.hinted) { lines.push({ memo: '관찰자 메모: 참은 화가 속에 쌓이고 있다. 압력이 위험 수준에 가까워진다.' }); T.hinted = true; }
      finish(lines, before);
    } else if (o.type === 'burst') {
      S.anger -= 30; S.rel -= 15; S.energy -= 5; S.nextBonus = 5;
      W.burst++; T.burst++;
      finish([o.line || pick(D.results.burst), { memo: '관찰자 메모: 남에게 터뜨린 화는 관계를 깎고, 다음 일을 꼬이게 만든다.' }], before);
    } else if (o.type === 'plain') {
      var e = o.eff || {};
      S.anger += e.anger || 0; S.rel += e.rel || 0; S.energy += e.energy || 0;
      finish([o.line || '좋은 일이었다.'], before);
    } else if (o.type === 'heal') {
      runGame(o.game, ev, function (score, line) {
        var g = D.games[o.game];
        var mult = S.lastHeal === o.game ? 0.5 : 1;
        S.anger -= Math.round(g.base * score * mult);
        S.energy -= g.energy;
        if (g.pressure) S.pressure += Math.round(g.pressure * score);
        if (g.rel) S.rel += g.rel;
        W.games[o.game] = true; S.lastHeal = o.game;
        W.heal++; T.heal++;
        var ls = [line || g.done];
        if (mult < 1) ls.push({ memo: '같은 방법을 연달아 써서 효과가 절반이다. 다른 방법도 써 보자.' });
        finish(ls, before);
      });
    } else if (o.type === 'trap') {
      runGame('trap', ev, function () {
        S.anger += 10; S.energy -= D.games.trap.energy; W.trap++;
        finish([D.games.trap.done, { memo: '관찰자 메모: 물건을 때리며 화를 풀면 오히려 화가 커지기 쉽다고 알려져 있다.' }], before);
      });
    }
  }

  function finish(lines, before) {
    S.anger = clamp(S.anger); S.energy = clamp(S.energy); S.rel = clamp(S.rel); S.pressure = clamp(S.pressure);
    S.today.peak = Math.max(S.today.peak, S.anger);
    var kind = null;
    if (S.pressure >= 100) kind = 'pressure';
    else if (S.anger >= 100) kind = 'anger';
    var go = function () { showResult(lines, before); };
    if (kind) boom(kind, go); else go();
  }

  function deltaChips(before) {
    var out = [];
    [['anger', '화'], ['energy', '기운'], ['rel', '관계']].forEach(function (p) {
      var d = S[p[0]] - before[p[0]];
      if (!d) return;
      var good = p[0] === 'anger' ? d < 0 : d > 0;
      out.push('<span class="chip ' + (good ? 'good' : 'bad') + '">' + p[1] + ' ' + (d > 0 ? '+' : '') + d + '</span>');
    });
    return out.join('') || '<span class="chip">변화 없음</span>';
  }

  function showResult(lines, before) {
    hud();
    var stage = $('#stage');
    var card = stage.querySelector('.evcard .body') || stage.querySelector('.mini');
    var html = '<div class="result" id="result">' + lines.map(function (l) {
      return typeof l === 'string' ? '<p class="line">' + esc(l) + '</p>' : '<p class="memo">' + esc(l.memo) + '</p>';
    }).join('') + '<div class="deltas">' + deltaChips(before) + '</div>';
    var last = S.ev >= events().length - 1;
    var out = S.energy <= 0;
    html += '<button class="btn btn-dark btn-block" id="btn-next" type="button">' + (out ? '기운이 바닥났다' : last ? '하루 마무리하기' : '다음') + '</button></div>';
    if (stage.querySelector('.mini')) {
      stage.innerHTML = '<article class="panel mini">' + html + '</article>';
    } else {
      var opts = $('#opts'); if (opts) opts.remove();
      card.insertAdjacentHTML('beforeend', html);
    }
    var btn = $('#btn-next');
    btn.onclick = next;
    try { btn.focus({ preventScroll: true }); } catch (e) {}
    var r = $('#result'); if (r && r.scrollIntoView) r.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function next() {
    if (S.energy <= 0) { S.today.early = true; S.week.early++; endDay(); return; }
    S.ev++;
    if (S.ev >= events().length) endDay(); else showEvent();
  }

  /* ---------- explosion ---------- */
  function boom(kind, then) {
    var W = S.week;
    var imgKey, title, text;
    if (kind === 'pressure') {
      S.pressure = 30; S.anger = clamp(Math.max(S.anger, 50)); S.rel = clamp(S.rel - 20);
      W.pexpl++; W.expl++; S.today.expl++;
      imgKey = 'pigscream'; title = '펑!!';
      text = '참고 참던 화가 한꺼번에 터졌다. 개체가 ' + role().pig + '처럼 됐다.';
    } else {
      S.anger = 45; S.rel = clamp(S.rel - 20);
      W.expl++; S.today.expl++;
      imgKey = 'speed'; title = '펑!';
      text = '화가 한계를 넘었다. 주변이 잠시 초토화됐다.';
    }
    var b = $('#boom');
    b.innerHTML = '<div class="panel"><img src="' + img(imgKey) + '" alt=""><div class="in"><h2 id="boom-title">' + title + '</h2><p class="hand" style="font-size:21px;line-height:1.35">' + esc(text) + '</p>' +
      '<div class="deltas"><span class="chip bad">관계 -20</span><span class="chip">화 → ' + S.anger + '</span></div>' +

  function mashGame(root, opts, fin) {
    // shared by dig and trap: tap as fast as possible for N seconds
    var n = 0, t0 = 0, ended = false, raf = 0;
    root.innerHTML = opts.scene + '<p class="mini-stat" aria-live="polite"><span id="mc">0</span> / ' + opts.target + ' · <span id="mt">' + opts.secs.toFixed(1) + '</span>초</p>' +
      '<button class="btn btn-dark btn-big btn-block" id="mash" type="button">' + opts.btn + '</button>';
    var mc = $('#mc'), mt = $('#mt');
    function tick() {
      var left = opts.secs - (performance.now() - t0) / 1000;
      if (left <= 0) { mt.textContent = '0.0'; end(); return; }
      mt.textContent = left.toFixed(1);
      raf = requestAnimationFrame(tick);
    }
    function end() {
      if (ended) return; ended = true;
      $('#mash').disabled = true;
      setTimeout(function () { fin(n / opts.target, opts.line(n)); }, 450);
    }
    function tap() {
      if (ended) return;
      if (!t0) { t0 = performance.now(); raf = requestAnimationFrame(tick); }
      n++; mc.textContent = n; opts.onTap(n);
    }
    $('#mash').addEventListener('pointerdown', function (e) { e.preventDefault(); tap(); });
    $('#mash').addEventListener('keydown', function (e) { if ((e.key === 'Enter') && !e.repeat) { e.preventDefault(); tap(); } });
    onKey('keydown', function (e) { if (e.code === 'Space' && !e.repeat && !isTyping(e)) { e.preventDefault(); tap(); } });
    cleanups.push(function () { cancelAnimationFrame(raf); });

  /* ---------- day report ---------- */
  function pickCard(key) {
    var seen = S.week.cards;
    var c = D.cards.filter(function (x) { return x.key === key; })[0];
    if (!c || seen.indexOf(c.key) >= 0) {
      var rest = D.cards.filter(function (x) { return seen.indexOf(x.key) < 0; });
      c = rest.length ? pick(rest) : pick(D.cards);
    }
    seen.push(c.key);
    return c;
  }
  function cardHTML(c) {

  /* ---------- week ending ---------- */
  function endingKey() {
    var W = S.week;
    var total = W.hold + W.burst + W.heal + W.trap;
    var healR = W.heal / Math.max(1, total), holdR = W.hold / Math.max(1, total);
    var used = Object.keys(W.games).length;
    if (S.rel <= 15) return 'lonely';
    if (W.pexpl >= 2 || (holdR >= 0.45 && W.expl >= 1)) return 'bottled';
    if (W.early >= 3) return 'tired';
    if (W.expl === 0 && healR >= 0.6 && used >= 5) return 'master';
    if (W.expl <= 1 && healR >= 0.4 && W.burst <= 4) return 'calm';
    return 'survived';
  }
